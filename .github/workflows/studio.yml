name: studio

# The studio's bot on GitHub's runners, so the public world's escrow does not depend on anyone's machine being on:
# every six hours it sends the studio's heartbeat, exports the live world from the site, seals it as the next
# epoch, runs the pinned verifier on it, commits it, has a stranger ask the enclave to verify it, relays NEAR's
# quote check, and hands every player their own inclusion proof. The epoch's public record is committed back.
#
# Needs one secret, ENCROE_STUDIO_SECRETS: base64 of a tar.gz of the repository's .env (account ids and
# ENCROE_STUDIO_TOKEN) and the studio's and the stranger's testnet key files. Made with:
#   tar czf - .env -C "$HOME" .near-credentials/testnet/encore-pub-6b4dad.testnet.json \
#     .near-credentials/testnet/encore-stranger-6b4dad.testnet.json | base64 | gh secret set ENCROE_STUDIO_SECRETS
# STUDIO_COMMIT_EMAIL is the GitHub commit email of the Vercel project owner.
# Testnet only. Turn it off with the repository variable STUDIO_ENABLED=false.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio
  cancel-in-progress: false

jobs:
  seal:
    if: vars.STUDIO_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENCROE_GAME_URL: https://encroe.vercel.app
      # Each game's public world and its escrow: Embergate's ours, the others made by the factory (encroe.testnet).
      WORLDS: "embergate:encroe-embergate.testnet matchday:matchday.encroe.testnet neon-city:neon-city.encroe.testnet starhaul:starhaul.encroe.testnet orchard:orchard.encroe.testnet"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: tools (near-cli-rs, the encore CLI)
        run: |
          npm ci
          cargo build -q --release -p encore-cli -p encore-attest
      - name: the studio's keys (never printed)
        env:
          ENCROE_STUDIO_SECRETS: ${{ secrets.ENCROE_STUDIO_SECRETS }}
        run: |
          test -n "$ENCROE_STUDIO_SECRETS" || { echo "ENCROE_STUDIO_SECRETS is not set" >&2; exit 1; }
          umask 077
          echo "$ENCROE_STUDIO_SECRETS" | base64 -d | tar xzf -
          mkdir -p "$HOME/.near-credentials/testnet"
          mv .near-credentials/testnet/*.json "$HOME/.near-credentials/testnet/"
          rm -rf .near-credentials
      - name: heartbeats
        run: |
          for w in $WORLDS; do
            ESCROW_NAME=${w%%:*} ESCROW_ACCOUNT=${w##*:} scripts/studio/bot.sh heartbeat || echo "heartbeat ${w%%:*} failed"
          done
      - name: seal every live world that has players
        run: |
          failed=0
          for w in $WORLDS; do
            g=${w%%:*}
            players=$(curl -sf "$ENCROE_GAME_URL/api/games/$g/world" | python3 -c 'import json,sys;print(json.load(sys.stdin)["players"])' || echo 0)
            if [ "$players" -gt 0 ]; then
              ESCROW_NAME=$g ESCROW_ACCOUNT=${w##*:} STUDIO_GAME=$g ENCROE_CORE=web/public/core/$g.wasm \
                scripts/studio/bot.sh seal || { echo "seal $g failed"; failed=1; }
            else
              echo "$g: no players yet"
            fi
          done
          exit $failed
      - name: publish the record
        if: always()
        env:
          STUDIO_COMMIT_EMAIL: ${{ secrets.STUDIO_COMMIT_EMAIL }}
        run: |
          for d in docs/results/escrow/{embergate,matchday,neon-city,starhaul,orchard}; do
            [ -d "$d" ] && git add "$d"
          done
          git diff --cached --quiet && exit 0
          : "${STUDIO_COMMIT_EMAIL:?Set STUDIO_COMMIT_EMAIL to the GitHub commit email of the Vercel project owner}"
          git config user.name "encroe-studio"
          git config user.email "$STUDIO_COMMIT_EMAIL"
          git commit -m "studio: epoch records $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
      - name: remove the keys
        if: always()
        run: rm -rf .env .secrets "$HOME/.near-credentials"
