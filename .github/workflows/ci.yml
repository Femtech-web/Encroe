name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks) and never-public paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks v8.30.1 (checksum-verified release binary)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="HEAD" -v .
      - name: keys, .env files and sealed secrets are never tracked
        run: |
          if git ls-files | grep -E '^(\.secrets/|(.*/)?\.env$|(.*/)?\.env\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo "never-public path is tracked"; exit 1
          fi

  rust:
    name: sealing, the verifier, the game core (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p encore-crypto -p encore-verifier
      - run: cd crates/embergate-core && cargo test && cargo build --release --target wasm32-unknown-unknown

  contracts:
    name: the escrow and the factory (wasm builds, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contracts/encroe-escrow
            contracts/encroe-factory
      - run: npm ci
      # The factory compiles the escrow's wasm in, so the escrow is built first.
      - run: cd contracts/encroe-escrow && ../../node_modules/.bin/cargo-near near build non-reproducible-wasm && cargo test
      - run: cd contracts/encroe-factory && ../../node_modules/.bin/cargo-near near build non-reproducible-wasm && cargo test

  web:
    name: the site (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
