[workspace]
resolver = "2"
members = ["crates/encore-crypto", "crates/encore-verifier", "crates/encore-thief", "crates/encore-cli", "crates/encore-attest"]
exclude = ["crates/encore-core-game", "crates/embergate-core", "contracts/encore-poc", "contracts/encore-t1", "contracts/encroe-escrow", "contracts/encroe-factory"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hex = { version = "0.4", features = ["serde"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
