[package]
name = "encroe-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encroe's factory and directory: any studio creates its game's escrow, keyless from birth, with the one escrow build compiled in"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
