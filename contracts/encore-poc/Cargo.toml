[package]
name = "encore-poc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encore go/no-go contract: heartbeat-gated public CKD release and OutLayer-verified sealed epochs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
