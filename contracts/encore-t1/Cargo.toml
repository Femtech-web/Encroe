[package]
name = "encore-t1"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encore with T1: an OutLayer run is accepted only after its TDX quote is verified on NEAR (DCAP verifier), bound to the run the contract requested"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
